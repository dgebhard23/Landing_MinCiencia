<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrusel liviano (sin jQuery)</title>
<link rel="stylesheet" href="../../base/tokens.css">
<link rel="stylesheet" href="../../base/base.css">
<link rel="stylesheet" href="modulo.css">

</head>
<body>
<header class="demo-cab"><a href="../../index.html">← Catálogo de funcionalidades</a><h1>Carrusel liviano (sin jQuery)</h1><p>Carrusel con scroll-snap nativo: se desliza con el dedo, flechas, puntos, teclado y avance automático que se pausa al pasar el mouse o al enfocar. Acepta imágenes de Google Drive pegando su enlace.</p></header>
<section class="seccion"><div class="contenedor">
  <p class="etiqueta">Galería</p><h2>Carrusel</h2>
  <div class="carrusel" data-carrusel data-intervalo="4000" aria-roledescription="carrusel" aria-label="Fotos de actividades">
    <div class="carrusel__pista" data-pista tabindex="0">
      <figure class="carrusel__item"><div class="foto" style="--h:210"></div><figcaption>Actividad 1</figcaption></figure><figure class="carrusel__item"><div class="foto" style="--h:260"></div><figcaption>Actividad 2</figcaption></figure><figure class="carrusel__item"><div class="foto" style="--h:300"></div><figcaption>Actividad 3</figcaption></figure><figure class="carrusel__item"><div class="foto" style="--h:340"></div><figcaption>Actividad 4</figcaption></figure><figure class="carrusel__item"><div class="foto" style="--h:20"></div><figcaption>Actividad 5</figcaption></figure><figure class="carrusel__item"><div class="foto" style="--h:160"></div><figcaption>Actividad 6</figcaption></figure>
    </div>
    <button class="carrusel__flecha carrusel__flecha--ant" type="button" aria-label="Anterior" data-ant>←</button>
    <button class="carrusel__flecha carrusel__flecha--sig" type="button" aria-label="Siguiente" data-sig>→</button>
    <div class="carrusel__puntos" data-puntos></div>
  </div>
</div></section>
<script src="modulo.js"></script>

</body>
</html>
